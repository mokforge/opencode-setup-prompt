minimum_pre_commit_version: "3.2.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: skill-frontmatter
        name: skill frontmatter has name and description
        entry: '\A---\r?\n(?=[\s\S]*?^name:[ \t]*\S[^\r\n]*$)(?=[\s\S]*?^description:[ \t]*\S[^\r\n]*$)[\s\S]*?^---[ \t]*$'
        language: pygrep
        files: ^skills/[^/]+/SKILL\.md$
        args: [--multiline, --negate]
      - id: no-placeholders
        name: no placeholders in templates and skills
        entry: '(# here|\bTODO\b|^\s*\.\.\.\s*$)'
        language: pygrep
        files: ^(templates|skills)/
        types: [text]
      - id: only-tech-lead-primary
        name: only tech-lead template is primary
        entry: '^mode:[ \t]*primary[ \t]*$'
        language: pygrep
        files: ^templates/agents/.*\.md$
        exclude: ^templates/agents/tech-lead\.md$
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.1
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        files: \.(ya?ml)$
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.10.1
    hooks:
      - id: prettier
        name: prettier (check Markdown)
        entry: prettier --check --ignore-unknown
        types: [markdown]
